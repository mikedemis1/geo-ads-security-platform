# Backend checks on every push and pull request.
#
# Nothing here needs the database or any secret. The tests set their own
# throwaway values for the required environment variables, and every route
# they touch is served from memory.
#
# Semgrep and Bandit are blocking: a new finding fails the build. The ZAP
# baseline runs against the live API with a real PostGIS container and is
# informational, because a passive scan of a dev server produces warnings
# (missing HSTS, CSP wording) that are documented in docs/security/ rather
# than fixed one by one in a lab app.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  deps:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Blocking, and against the lock rather than requirements.txt. The lock is
      # the full resolved set, so a finding here is a package the image really
      # installs, transitive ones included. Auditing the eleven direct pins
      # would come back clean while a vulnerable dependency three levels down
      # shipped anyway.
      - name: pip-audit
        run: pip-audit -r backend/requirements.lock.txt --progress-spinner=off
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/geo-ads-frontend/package-lock.json
      - run: npm ci
        working-directory: frontend/geo-ads-frontend
      # Informational, for the same kind of reason the ZAP baseline is. These
      # findings are in the react-scripts build toolchain: babel, webpack, svgo,
      # eslint. None of it ships. The runtime image is nginx plus the static
      # output of `npm run build`, and the Dockerfile copies only /src/build, so
      # node_modules never reaches a running container. The blocking check for
      # what actually ships is the Trivy scan of the frontend image in the next
      # job. npm audit fix --force is deliberately not run: it rewrites the
      # lockfile and can break the build to silence findings that do not ship.
      - name: npm audit
        working-directory: frontend/geo-ads-frontend
        continue-on-error: true
        run: npm audit --audit-level=high

  image:
    name: container scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the images
        run: |
          docker build -t geo-ads-backend:ci backend
          docker build -t geo-ads-frontend:ci frontend/geo-ads-frontend
      # Blocking on the application layer of the backend image, which is the
      # part this repository controls. Clean as of 2026-09-14.
      - name: scan the backend image, application packages
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: geo-ads-backend:ci
          scanners: vuln
          vuln-type: library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      # Informational, and the reason is specific rather than a shrug. The base
      # is python:3.12-slim, already the newest published build. Its three
      # critical findings are all perl-base, waiting on a Debian rebuild that
      # has not happened, in a package a FastAPI service never calls. Nothing in
      # this repository can fix them today. Week 8 of the programme replaces
      # this base with a distroless image, which removes perl along with the
      # rest of the shell. Until then the number is reported, not hidden.
      - name: scan the backend image, operating system packages
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: geo-ads-backend:ci
          scanners: vuln
          vuln-type: os
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      # Blocking, everything. This one passes because the base image was moved
      # on 2026-09-14 from 1.27-alpine, last rebuilt June 2025, to the current
      # stable-alpine pinned by digest. That single change took the image from
      # 2 critical and 32 high to zero.
      - name: scan the frontend image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: geo-ads-frontend:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  sast:
    name: semgrep and bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep "bandit[sarif]"
      - name: semgrep
        run: >
          semgrep scan --config p/python --config p/security-audit --config p/secrets
          --metrics=off --error --sarif --output semgrep.sarif backend/app
      - name: bandit
        run: bandit -r backend/app -q -f sarif -o bandit.sarif
      - name: upload semgrep sarif
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: upload bandit sarif
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

  dast:
    name: zap baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: start the database
        run: |
          echo "POSTGRES_PASSWORD=ci-only-$(openssl rand -hex 12)" > .env
          docker compose up -d --wait db
      - name: start the api
        working-directory: backend
        run: |
          pip install -r requirements.txt
          cat > .env <<EOF
          JWT_SECRET=$(openssl rand -hex 32)
          ADMIN_TOKEN_SECRET=$(openssl rand -hex 32)
          ADMIN_USER=admin
          ADMIN_PASS=$(openssl rand -hex 12)
          DB_PASSWORD=$(sed 's/^POSTGRES_PASSWORD=//' ../.env)
          EOF
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: zap baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8000
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline
