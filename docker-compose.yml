services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geo_ads_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: geo_ads_user
      # Read from a .env file next to this compose file. Compose refuses to
      # start without it, so the password never has to live in the repo.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file next to docker-compose.yml}
      POSTGRES_DB: geo_ads
    ports:
      - "5433:5432"
    volumes:
      - geo_ads_db_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_ads_user -d geo_ads"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  geo_ads_db_data:
