server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths are routes, not missing files, so they
    # get index.html and React decides what they mean.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change under the same name.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx advertises its version on error pages and in the Server header
    # by default. It is free to turn off and there is no reason to publish it.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # unsafe-inline is required by the current build and is a known limit,
    # recorded in the README. connect-src covers the API and the WebSocket.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8000 ws://localhost:8000; frame-ancestors 'none'" always;
}
